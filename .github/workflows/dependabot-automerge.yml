name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions: {}

# One run per PR; a newer push supersedes the pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    # The PR author, not github.actor (the last actor on the event, which can be spoofed),
    # and only for branches in this repository.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    # Wait for the CI run on the pull request head, then squash-merge that exact
    # commit. This does not use `gh pr merge --auto`. With branch protection, the
    # required checks still gate the merge; without it, the wait is what keeps an
    # untested commit off the default branch. `--match-head-commit` refuses the
    # merge if the head moved after CI ran.
    # A merge made with GITHUB_TOKEN does not trigger the push CI workflow. The
    # weekly schedule on the CI workflow still tests the default branch.
    timeout-minutes: 30
    permissions:
      actions: read         # find and watch the CI run for the PR head
      contents: write       # squash the PR into main after CI succeeds
      pull-requests: write  # merge the PR
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Docker base image updates never auto-merge. The docker ecosystem can move the tag
      # (python:3.12-slim -> 3.14-slim is a Python runtime upgrade that Dependabot labels
      # semver-minor), so these PRs stay open for a human review.
      - name: Leave Docker base image updates for review
        if: steps.metadata.outputs.package-ecosystem == 'docker'
        run: echo "::notice title=Not auto-merged::Docker base image update ($DEPS $PREV -> $NEW). Docker updates always wait for a human review."
        env:
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          PREV: ${{ steps.metadata.outputs.previous-version }}
          NEW: ${{ steps.metadata.outputs.new-version }}

      # Allowlist, not a major-version denylist: update-type is the highest change in the PR
      # (a grouped PR with one major is skipped), and it is empty when the PR carries a
      # non-Dependabot commit, so only minor and patch updates are auto-merged.
      # A failed or cancelled CI run fails this step and nothing merges. --match-head-commit
      # refuses the merge if the PR head moved after CI ran.
      - name: Merge semver-minor and semver-patch updates after CI succeeds
        if: >-
          steps.metadata.outputs.package-ecosystem != 'docker' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow ci.yml --event pull_request \
              --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No CI run found for $HEAD_SHA"
            exit 1
          fi
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 10
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
