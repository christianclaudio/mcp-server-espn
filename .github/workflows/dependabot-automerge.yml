name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  automerge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    # The PR author, not github.actor (the last actor on the event, which can be spoofed),
    # and only for branches in this repository.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    permissions:
      contents: write       # auto-merge squashes the PR into main once required checks pass
      pull-requests: write  # enable auto-merge on the PR
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Allowlist, not a major-version denylist: update-type is the highest change in the PR
      # (a grouped PR with one major is skipped), and it is empty when the PR carries a
      # non-Dependabot commit, so only minor and patch updates are auto-merged.
      - name: Enable auto-merge for semver-minor and semver-patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
