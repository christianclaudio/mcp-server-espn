name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions: {}

# One run per PR; a newer push supersedes the pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    # The PR author, not github.actor (the last actor on the event, which can be spoofed),
    # and only for branches in this repository.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    # Wait for the CI run on the pull request head, then squash-merge that exact
    # commit. This does not use `gh pr merge --auto`. With branch protection, the
    # required checks still gate the merge; without it, the wait is what keeps an
    # untested commit off the default branch. `--match-head-commit` refuses the
    # merge if the head moved after CI ran.
    # A merge made with GITHUB_TOKEN does not trigger the push CI workflow. The
    # weekly schedule on the CI workflow still tests the default branch.
    timeout-minutes: 30
    permissions:
      actions: read         # find and watch the CI run for the PR head
      contents: write       # squash the PR into main after CI succeeds
      pull-requests: write  # merge the PR
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Check out the PR history so the next step can read commit objects. No PR code
      # runs, and the token is not written to .git/config. fetch-depth 0 also fetches the
      # base branch as origin/<base>.
      - name: Check out PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Every PR commit must be either (A) Dependabot's: one parent, author dependabot[bot],
      # committer web-flow, verified; or (B) a clean GitHub update-branch merge: two parents,
      # committer web-flow, verified, parent 2 on the base branch, and a tree equal to
      # `git merge-tree --write-tree` of its parents (a conflict resolution with hand edits
      # fails this). Any other commit, such as a crew commit or a local `git merge main`,
      # means no auto-merge: the step prints a notice, exits 0, and the PR waits for a human.
      # The head SHA must be in the commit list (GitHub does not promise the order), and a
      # PR with 250 commits (the API maximum) is skipped because the list may be cut off.
      - name: Classify PR commits
        id: commits
        run: |
          set -euo pipefail
          allowed=true
          commits="$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
            --jq '.[] | [.sha, (.author.login // "-"), (.committer.login // "-"),
              (.commit.verification.verified | tostring),
              ([.parents[].sha] | join(" "))] | @tsv')"
          count="$(printf '%s\n' "$commits" | grep -c . || true)"
          if ! printf '%s\n' "$commits" | cut -f1 | grep -xF "$HEAD_SHA" >/dev/null; then
            echo "::notice title=Not auto-merged::head $HEAD_SHA is not in the PR commit list (head moved); the newer run decides"
            allowed=false
          elif [ "$count" -ge 250 ]; then
            echo "::notice title=Not auto-merged::the PR lists $count commits, the API maximum, so not every commit can be checked"
            allowed=false
          else
            while IFS=$'\t' read -r sha author committer verified parents; do
              read -r p1 p2 extra <<< "$parents"
              ok=false
              if [ -n "$p1" ] && [ -z "$p2" ] && [ "$author" = "dependabot[bot]" ] \
                && [ "$committer" = "web-flow" ] && [ "$verified" = "true" ]; then
                ok=true
              elif [ -n "$p2" ] && [ -z "$extra" ] && [ "$committer" = "web-flow" ] \
                && [ "$verified" = "true" ] \
                && git merge-base --is-ancestor "$p2" "origin/$BASE_REF"; then
                merged="$(git merge-tree --write-tree "$p1" "$p2" 2>/dev/null)" || merged=""
                actual="$(git rev-parse --verify --quiet "$sha^{tree}")" || actual=""
                if [ -n "$merged" ] && [ "$merged" = "$actual" ]; then ok=true; fi
              fi
              if [ "$ok" != true ]; then
                echo "::notice title=Not auto-merged::commit ${sha:0:7} by $author (committer $committer) is not Dependabot or a clean update-branch merge"
                allowed=false
              fi
            done <<< "$commits"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker base image updates never auto-merge. The docker ecosystem can move the tag
      # (python:3.12-slim -> 3.14-slim is a Python runtime upgrade that Dependabot labels
      # semver-minor), so these PRs stay open for a human review.
      - name: Leave Docker base image updates for review
        if: steps.metadata.outputs.package-ecosystem == 'docker'
        run: echo "::notice title=Not auto-merged::Docker base image update ($DEPS $PREV -> $NEW). Docker updates always wait for a human review."
        env:
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          PREV: ${{ steps.metadata.outputs.previous-version }}
          NEW: ${{ steps.metadata.outputs.new-version }}

      # Allowlist, not a major-version denylist: update-type is the highest change in the PR
      # (a grouped PR with one major is skipped), so only minor and patch updates are
      # auto-merged. fetch-metadata checks only the first PR commit, so the commits step
      # above checks every commit, and this step runs only when all of them are allowed.
      # A failed or cancelled CI run fails this step and nothing merges. --match-head-commit
      # refuses the merge if the PR head moved after CI ran.
      - name: Merge semver-minor and semver-patch updates after CI succeeds
        if: >-
          steps.metadata.outputs.package-ecosystem != 'docker' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          steps.commits.outputs.allowed == 'true'
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow ci.yml --event pull_request \
              --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No CI run found for $HEAD_SHA"
            exit 1
          fi
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 10
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
