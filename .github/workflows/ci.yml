name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merges made by dependabot-automerge.yml use GITHUB_TOKEN, and pushes made
  # with GITHUB_TOKEN don't trigger push workflows, so the push trigger above
  # misses them. The weekly run tests main itself on Sunday afternoon Eastern,
  # after the Sunday morning Dependabot run (.github/dependabot.yml), and is the
  # only scheduled run of the drift-check job (manual dispatch also runs it);
  # schedule runs only on the default branch.
  # timezone keeps it at 15:37 Eastern through daylight saving changes. The minute
  # is off the hour to avoid peak scheduler load.
  schedule:
    - cron: '37 15 * * 0'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each push to main gets its own group, keyed on the commit SHA, so runs for
  # different main commits never wait behind, replace or cancel each other.
  # Pull request runs share one group per PR ref, and a new push to the PR cancels
  # the run in progress.
  # Scheduled and workflow_dispatch runs on main share the CI-refs/heads/main
  # group and never cancel a run in progress; only the newest pending run waits,
  # and older pending runs are dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-types:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Static type analysis
        run: uv run mypy --strict src

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Run unit test suite
        run: uv run pytest

  tool-contract:
    name: Tool contract assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Verify tool contracts
        run: uv run python scripts/check_tool_contract.py

      - name: Verify OpenAPI drift
        run: uv run python scripts/check_openapi_drift.py

      - name: Protocol & stdio verification
        run: uv run pytest tests/test_protocol.py --no-cov

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Protocol conformance suite
        run: ./scripts/check_conformance.sh

  build-check:
    name: Build and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Build wheel and sdist
        run: uv build

      - name: Reject fallback and untagged versions
        run: uv run python scripts/check_version.py

      - name: Validate distribution
        run: uv run twine check dist/*

  docker-build:
    name: Container builder CA floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mcp-server-ci:test

      - name: Runtime image has the project and no build backend
        # The builder installs the build backend to /tmp/build-backend, outside the venv the
        # runtime stage copies. These are build-only packages, and this repo's lock has none of
        # them at runtime.
        run: |
          PROJECT="$(grep -m 1 '^name = ' pyproject.toml | cut -d '"' -f 2)"
          docker run --rm --entrypoint pip mcp-server-ci:test show "$PROJECT" > /dev/null
          for pkg in hatchling uv-dynamic-versioning dunamai trove-classifiers tomlkit jinja2 \
            MarkupSafe pathspec pluggy; do
            if docker run --rm --entrypoint pip mcp-server-ci:test show "$pkg" > /dev/null 2>&1; then
              echo "::error::build backend package $pkg is in the runtime image"
              exit 1
            fi
          done
          echo "Runtime image has $PROJECT and no build backend"

      - name: Image serves MCP over stdio
        # Starts the runtime image on its default stdio transport with no network, sends
        # initialize, notifications/initialized and tools/list, and holds stdin open until
        # the tools/list reply arrives so the check does not depend on shutdown-on-EOF timing.
        # Replies are matched by JSON-RPC id, not by line order.
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/mcp-in"
          OUT="$RUNNER_TEMP/mcp-out"
          mkfifo "$IN"
          : > "$OUT"
          timeout 60 docker run -i --rm --network none mcp-server-ci:test < "$IN" > "$OUT" &
          SERVER=$!
          exec 3> "$IN"
          wait_for_id() {
            for _ in $(seq 1 150); do
              if jq -se --argjson id "$1" 'any(.[]; .id == $id)' "$OUT" > /dev/null 2>&1; then
                return 0
              fi
              sleep 0.2
            done
            echo "No reply with id $1 within 30s"; cat "$OUT"; exit 1
          }
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' >&3
          wait_for_id 1
          printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' >&3
          printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' >&3
          wait_for_id 2
          exec 3>&-
          wait "$SERVER"
          jq -se 'map(select(.id == 1))[0].result.protocolVersion == "2025-11-25"' "$OUT"
          jq -se '(map(select(.id == 2))[0].result.tools | length) > 0' "$OUT"
          echo "Image answered initialize and tools/list over stdio"

      - name: Builder fails below the ca-certificates floor
        # Raising CA_CERTIFICATES_FLOOR above any real Debian version makes the installed
        # package older than the floor, whatever version the base image or trixie-security
        # ships, so this is deterministic. The build must fail at the builder's floor check,
        # with its message, and before the pip bootstrap step starts.
        run: |
          set +e
          docker build --target builder --progress=plain \
            --build-arg CA_CERTIFICATES_FLOOR=99991231 . > ca-floor.log 2>&1
          status=$?
          set -e
          cat ca-floor.log
          if [ "$status" -eq 0 ]; then
            echo "::error::builder built with a ca-certificates floor above the installed version"
            exit 1
          fi
          if ! grep -q "is older than the floor 99991231" ca-floor.log; then
            echo "::error::builder failed, but not at the ca-certificates floor check"
            exit 1
          fi
          if grep -q -- "--require-hashes" ca-floor.log; then
            echo "::error::the pip bootstrap step started before the ca-certificates floor check failed"
            exit 1
          fi
          echo "Builder stops at the ca-certificates floor check before any pip step"

  drift-check:
    name: Check API Drift
    # Scheduled and manual runs only; pushes and pull requests skip it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Run OpenAPI drift detection
        run: uv run python scripts/check_openapi_drift.py
