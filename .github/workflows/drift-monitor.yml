name: Weekly OpenAPI Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC (12:00 AM EDT)
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  drift-check:
    name: Check API Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.10

      - name: Run OpenAPI drift detection
        run: uv run python scripts/check_openapi_drift.py
