name: Weekly OpenAPI Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC (12:00 AM EDT)
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  drift-check:
    name: Check API Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run OpenAPI drift detection
        run: python scripts/check_openapi_drift.py
