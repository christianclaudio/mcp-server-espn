name: Weekly OpenAPI Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# One drift check at a time; a manual run waits for a scheduled one instead of racing it.
# queue: max lets up to 100 runs wait instead of cancelling them (GitHub does not
# guarantee their order).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  drift-check:
    name: Check API Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.10

      - name: Run OpenAPI drift detection
        run: uv run python scripts/check_openapi_drift.py
