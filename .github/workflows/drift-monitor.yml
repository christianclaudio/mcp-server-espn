name: Weekly OpenAPI Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# One drift check at a time; a manual run waits for a scheduled one instead of racing it.
# queue: max lets up to 100 runs wait instead of cancelling them (GitHub does not
# guarantee their order).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  drift-check:
    name: Check API Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.10

      - name: Run OpenAPI drift detection
        run: uv run python scripts/check_openapi_drift.py
