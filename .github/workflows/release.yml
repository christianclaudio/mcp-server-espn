name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build, Attest & Publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write      # create the GitHub Release
      packages: write      # push the GHCR image
      id-token: write      # OIDC for PyPI Trusted Publishing, build provenance and the MCP Registry login
      attestations: write  # build provenance
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"

      - name: Extract Tag Version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Wheel & Source Dist
        run: uv build

      - name: Verify wheel version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL_VERSION="$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -n 1)"
          if [ "$WHEEL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::wheel METADATA version '${WHEEL_VERSION}' does not match tag ${GITHUB_REF_NAME} (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "Wheel version ${WHEEL_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Build release notes
        run: python3 scripts/release_notes.py --to "$GITHUB_REF_NAME" > release-notes.md

      - name: Verify Packages
        run: |
          uv pip install --system twine==7.0.0 cyclonedx-bom==7.5.0
          twine check dist/*

      - name: Generate CycloneDX SBOM
        run: |
          # Describe only what ships: a clean venv with the built wheel and its
          # runtime dependencies (no pip, no build tooling from the runner).
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install dist/*.whl
          cyclonedx-py environment "$RUNNER_TEMP/sbom-env" -o sbom.cdx.json

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        continue-on-error: true
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
          body_path: release-notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            UV_DYNAMIC_VERSIONING_BYPASS=${{ steps.meta.outputs.version }}

      # Runs last, so a Registry failure cannot stop the GitHub Release or the
      # GHCR image once PyPI has shipped.
      - name: Publish to MCP Registry via OIDC
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 -c "
          import json, os
          with open('server.json') as f:
              data = json.load(f)
          data['version'] = os.environ['VERSION']
          for pkg in data.get('packages', []):
              pkg['version'] = os.environ['VERSION']
          with open('server.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          ARCHIVE="mcp-publisher_${OS}_${ARCH}.tar.gz"
          curl -L -s -o "$ARCHIVE" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$ARCHIVE"
          curl -L -s -o checksums.txt "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt"
          sha256sum --ignore-missing --check checksums.txt
          tar xz -f "$ARCHIVE" mcp-publisher
          rm "$ARCHIVE" checksums.txt

          MAX_RETRIES=3
          for ATTEMPT in $(seq 1 "$MAX_RETRIES"); do
            if ./mcp-publisher login github-oidc; then
              break
            fi
            if [ "$ATTEMPT" -eq "$MAX_RETRIES" ]; then
              echo "mcp-publisher login failed after $MAX_RETRIES attempts" >&2
              exit 1
            fi
            echo "mcp-publisher login failed (attempt $ATTEMPT/$MAX_RETRIES), retrying in 5s..."
            sleep 5
          done
          ./mcp-publisher publish
