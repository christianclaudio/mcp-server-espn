version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Generated from uv.lock by scripts/gen_build_backend.py. The uv scan treats
    # requirements-shaped *.txt files as pip manifests, so ignore this one.
    # Lock bumps still land in uv.lock; regenerate the file with the script.
    exclude-paths:
      - "docker/build-backend.txt"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    ignore:
      # Keep python 3.12; a Python minor upgrade is a separate decision. Digest updates still come through.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
