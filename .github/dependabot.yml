version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
